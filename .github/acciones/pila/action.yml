# La pila local de Supabase en un job de ci.yml (`pnpm exec supabase start`), con sus puertos reservados antes de levantarla.
# Los puertos de `supabase/config.toml` (546xx, y los 543xx que la CLI usa por defecto) caen en el rango efímero de Linux (32768–60999): mientras
# `supabase start` baja sus imágenes en paralelo, una conexión saliente puede tomar uno y el contenedor cae con «address already in use»
# (CI 42308509323: 0.0.0.0:54622, la base). Reservados en `ip_local_reserved_ports`, el kernel no los da como puerto de origen (vale también para IPv6).
name: pila
description: Supabase local con sus puertos reservados
inputs:
  sin:
    description: Los servicios que no se levantan (`supabase start -x`)
    required: true
runs:
  using: composite
  steps:
    - name: reservar los puertos de la pila
      shell: bash
      run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54300-54399,54600-54699
    - name: supabase start
      shell: bash
      env:
        SIN: ${{ inputs.sin }}
      run: pnpm exec supabase start -x "$SIN"
