name: ci

# Cómo corre y cuánto cuesta: docs/DECISIONES.md, «CI-1». Las reglas de este archivo las prueba scripts/guardas/workflows.test.ts.
# Por niveles (docs/ORCA.md): un PR corre el Nivel 1 y los e2e dirigidos a lo tocado (el completo de escritorio si toca un disparador del
# Nivel 2: scripts/e2e-dirigidos.mjs); cada noche, el completo de escritorio sobre main si hubo commits; antes de cerrar una fase, el
# completo con los dos proyectos a mano (workflow_dispatch, `proyectos: ambos`).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * *' # 03:00 en La Paz
  workflow_dispatch:
    inputs:
      proyectos:
        description: 'Proyectos del e2e: escritorio (como el Nivel 2) o ambos (el Nivel 3, el cierre de una fase)'
        type: choice
        options: [escritorio, ambos]
        default: escritorio
      e2e:
        description: 'Compilar la app y correr el e2e en sus 4 bloques'
        type: boolean
        default: true
      carreras:
        description: 'Correr las carreras con dos conexiones (docs/PLAN.md, 9-6): cada corrida cuenta para las 5 seguidas en verde'
        type: boolean
        default: false

permissions:
  contents: read

# Un push nuevo a la misma rama (o al mismo PR) cancela la corrida anterior. Un dispatch (un e2e de 70 a 96 min, unas carreras)
# tiene su propio grupo, con run_id, y nunca se cancela: ni un push lo corta ni otro dispatch lo deja en espera.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('ci-manual-{0}-{1}', github.ref, github.run_id) || format('ci-{0}', github.head_ref || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# Acciones de terceros admitidas, una por línea con su motivo (`# accion-de-terceros: <dueño/repo> — <motivo>`).
# Hoy ninguna: sólo acciones de GitHub (`actions/*`), fijadas por SHA, y la local `./.github/acciones/preparar`.

env:
  # El stack local de Supabase usa los puertos 546xx (supabase/config.toml).
  SUPABASE_API_LOCAL: http://127.0.0.1:54621
  SUPABASE_DB_LOCAL: postgresql://postgres:postgres@127.0.0.1:54622/postgres
  # La clave publicable fija de la pila local de la CLI (pública por diseño; no es la de un proyecto). El build del e2e la
  # inlinea y cada bloque comprueba que su `supabase status` da la misma: si la CLI la cambia, el bloque falla diciéndolo.
  CLAVE_PUBLICA_LOCAL: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
  # config.toml lee las credenciales de Google con env(): en CI van de relleno, nadie ingresa con Google.
  SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: relleno-ci
  SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: relleno-ci
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Siempre: algunas guardas de `pnpm test` leen docs/, así que un cambio sólo de documentación también lo corre.
  nivel-1:
    name: Nivel 1 · lint, tipos, tests y mapa
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/acciones/preparar
      - run: pnpm lint
      - run: pnpm typecheck # corre `next typegen` antes de tsc
      - run: pnpm test
      - run: bash scripts/mapa.sh --check

  # Lo que un PR puede tocar según su carril (scripts/guardas/carriles.mjs, docs/ORCA.md): el carril B no edita ESTADO, PLAN,
  # DECISIONES ni BITACORA ni crea migraciones de dominios compartidos; ninguna migración se intercala ni se edita.
  carriles:
    name: Carriles · lo que el PR puede tocar
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - env:
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          RAMA: ${{ github.head_ref }}
        run: node scripts/guardas/carriles.mjs "$BASE_PR" "$RAMA"

  # Decide si corren los jobs pesados (scripts/ci-cambios.sh, probado en scripts/ci-cambios.test.ts) y qué e2e corre un PR: el completo
  # en 4 bloques, los dirigidos en 1, o ninguno (scripts/e2e-dirigidos.mjs). Fuera de un PR, el completo.
  cambios:
    name: Cambios · ¿base y e2e?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pesado: ${{ steps.filtro.outputs.pesado }}
      e2e: ${{ steps.filtro.outputs.e2e }}
      e2e_modo: ${{ steps.e2e.outputs.e2e_modo }}
      e2e_specs: ${{ steps.e2e.outputs.e2e_specs }}
      e2e_bloques: ${{ steps.e2e.outputs.e2e_bloques }}
      e2e_de: ${{ steps.e2e.outputs.e2e_de }}
      e2e_proyectos: ${{ steps.e2e.outputs.e2e_proyectos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El diff necesita `before` (push) y la base del PR: con un clon superficial no están y todo cae a «pesado».
          fetch-depth: 0
      - id: filtro
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-cambios.sh >> "$GITHUB_OUTPUT"
      - id: e2e
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENTO" = pull_request ]; then
            node scripts/e2e-dirigidos.mjs --rango "$BASE_PR...HEAD" --github >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' e2e_modo=completo e2e_specs= 'e2e_bloques=[1,2,3,4]' e2e_de=4 e2e_proyectos=escritorio >> "$GITHUB_OUTPUT"
          fi

  base:
    name: Base · reset, tipos, probar, lint y advisors
    needs: cambios
    if: needs.cambios.outputs.pesado == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/acciones/preparar
      # La CLI es la devDependency (`pnpm exec supabase`): la misma versión que en local, fijada por pnpm-lock.yaml.
      - run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - run: pnpm db:reset
      - name: db:types sin diff
        run: |
          pnpm db:types
          git diff --exit-code -- src/shared/types/database.types.ts
      - run: pnpm db:probar
      - run: pnpm db:lint
      - name: splinter (advisors de seguridad, la copia del repo)
        run: |
          psql "$SUPABASE_DB_LOCAL" -At -v ON_ERROR_STOP=1 -f scripts/splinter.sql > "$RUNNER_TEMP/advisors.txt"
          if grep -i '|ERROR|' "$RUNNER_TEMP/advisors.txt"; then echo "::error::Advisors con nivel ERROR"; exit 1; fi

  # docs/PLAN.md, 9-6: dos o tres conexiones reales, sólo a mano (`carreras: true`) hasta 5 corridas seguidas en verde; entonces
  # pasan a `base`. Sin reintentos: `scripts/carreras.mjs` falla si una carrera no llegó a probarse.
  carreras:
    name: Carreras · db:carreras (a mano, 9-6)
    if: github.event_name == 'workflow_dispatch' && inputs.carreras
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/acciones/preparar
      - run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - run: pnpm db:reset
      - run: pnpm db:carreras

  # La app se compila una vez y los bloques bajan la misma (docs/DECISIONES.md, «CI-1»: factura menos y corre en
  # paralelo con el Nivel 1, que los bloques esperan igual). Un PR sin e2e que correr (`e2e_modo: ninguno`) no compila.
  # Con workflow_dispatch, `e2e: false` lo apaga (para correr sólo las carreras).
  e2e-build:
    name: e2e · compilar la app
    needs: cambios
    if: needs.cambios.outputs.e2e == 'true' && needs.cambios.outputs.e2e_modo != 'ninguno' && (github.event_name != 'workflow_dispatch' || inputs.e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/acciones/preparar
      - name: next build en .next-e2e
        env:
          NEXT_DIST_DIR: .next-e2e
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_API_LOCAL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.CLAVE_PUBLICA_LOCAL }}
        run: pnpm exec next build
      - name: empaquetar sin la caché de compilación
        run: tar --exclude=.next-e2e/cache -czf "$RUNNER_TEMP/next-e2e.tgz" .next-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-e2e
          path: ${{ runner.temp }}/next-e2e.tgz
          retention-days: 1
          if-no-files-found: error

  # Cada bloque tiene su runner y su pila de Supabase: una base por bloque. Sin reintentos (`retries: 0`): la causa de un
  # fallo va a los artefactos y a e2e-fallos/. Las carreras (`db:carreras`) van en su job, a mano (docs/PLAN.md, 9-6).
  e2e:
    name: e2e · bloque ${{ matrix.bloque }} de ${{ needs.cambios.outputs.e2e_de }}
    needs: [cambios, nivel-1, e2e-build]
    if: needs.cambios.outputs.e2e == 'true' && needs.cambios.outputs.e2e_modo != 'ninguno' && (github.event_name != 'workflow_dispatch' || inputs.e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 4 bloques para el completo; 1 para los dirigidos de un PR (scripts/e2e-dirigidos.mjs).
        bloque: ${{ fromJSON(needs.cambios.outputs.e2e_bloques || '[1,2,3,4]') }}
    env:
      # Escritorio por defecto; `proyectos: ambos` (workflow_dispatch) corre los dos, el Nivel 3. Los dirigidos de un PR que toca
      # interfaz, también los dos (el Nivel 1).
      PROYECTOS: ${{ inputs.proyectos || needs.cambios.outputs.e2e_proyectos || 'escritorio' }}
      # Vacío: el completo. Si no, los specs dirigidos, separados por espacios.
      ESPECS: ${{ needs.cambios.outputs.e2e_specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/acciones/preparar
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: chromium y lo que pide del sistema
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec supabase start -x studio,imgproxy,logflare,vector
      - name: .env.local desde supabase status
        run: |
          pnpm exec supabase status -o env > "$RUNNER_TEMP/status.env"
          leer() { grep "^$1=" "$RUNNER_TEMP/status.env" | cut -d= -f2- | tr -d '"'; }
          publica=$(leer PUBLISHABLE_KEY)
          servidor=$(leer SECRET_KEY)
          rm "$RUNNER_TEMP/status.env"
          echo "::add-mask::$servidor"
          if [ "$publica" != "$CLAVE_PUBLICA_LOCAL" ]; then
            echo "::error::La clave publicable de la pila no es CLAVE_PUBLICA_LOCAL: la app compilada no podría hablarle. Actualízala en ci.yml."
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_API_LOCAL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publica"
            echo "SUPABASE_SECRET_KEY=$servidor"
          } > .env.local
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-e2e
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/next-e2e.tgz"
      - run: pnpm db:reset
      # Las tres que exige e2e/soporte/guardia.ts (FUNCIONES), con su regla: OPTIONS responde y no es 404 ni 5xx.
      - name: funciones edge (las pide e2e/global-setup.ts)
        run: |
          nohup pnpm exec supabase functions serve > "$RUNNER_TEMP/funciones.log" 2>&1 &
          funciones="apibara storage-gc avatares-miniaturas"
          for _ in $(seq 1 60); do
            faltan=""
            for f in $funciones; do
              s=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$SUPABASE_API_LOCAL/functions/v1/$f" || true)
              if [ "$s" = 000 ] || [ "$s" = 404 ] || [ "${s:0:1}" = 5 ]; then faltan="$faltan $f"; fi
            done
            if [ -z "$faltan" ]; then echo "servidas: $funciones"; exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/funciones.log"
          echo "::error::Las funciones edge no respondieron en 120 s:$faltan"
          exit 1
      - name: e2e (${{ needs.cambios.outputs.e2e_modo }}), bloque ${{ matrix.bloque }} de ${{ needs.cambios.outputs.e2e_de }}
        env:
          E2E_PROD: '1'
          E2E_COMPLETO: '1'
          DE: ${{ needs.cambios.outputs.e2e_de || '4' }}
        run: |
          proyecto=(--project=escritorio)
          if [ "$PROYECTOS" = ambos ]; then proyecto=(); fi
          read -ra especs <<< "$ESPECS"
          pnpm exec playwright test --shard=${{ matrix.bloque }}/"$DE" "${proyecto[@]}" "${especs[@]}"
      - name: el log de las funciones, junto a los artefactos
        if: failure()
        run: cp "$RUNNER_TEMP/funciones.log" e2e-fallos/ 2>/dev/null || { mkdir -p e2e-fallos && cp "$RUNNER_TEMP/funciones.log" e2e-fallos/; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-bloque-${{ matrix.bloque }}
          path: |
            playwright-report/
            e2e-fallos/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
