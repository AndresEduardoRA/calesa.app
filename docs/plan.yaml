    titulo: 'La pantalla de una cotización guardada: /cotizaciones/[id], revisiones por cursor y «Cotizar encima»'
    depende_de: []
    carril: a
    riesgo: ambar
    modulos: [src/modules/cotizaciones/, src/app/(app)/cotizaciones/, docs/]
    ruteo:
      { agente: claude, modelo: sonnet, effort: high, modo: auto, sesion: nueva, revisor: ninguno }
    verificacion: 'Nivel 1; el completo de escritorio por la cuenta (1 de 3)'
    terminado: 'La pantalla edita SU versión, ofrece cotizar encima y lista las revisiones por cursor registradas en RPC_PAGINADAS'
  - id: '4.15-4'
    titulo: 'Partir las entradas de cotizaciones por área para correr carriles en paralelo (sin cambiar el comportamiento)'
    depende_de: ['4.15-3']
    carril: a
    riesgo: ambar
    modulos: [src/modules/cotizaciones/, docs/]
    ruteo:
      { agente: claude, modelo: sonnet, effort: high, modo: auto, sesion: nueva, revisor: ninguno }
    verificacion: 'Nivel 1; nada cambia de pantalla'
    terminado: 'Cada área (listado, tarjeta, plantilla, formula, diseno, tablas, papelera, final, comprobantes, comentarios) tiene sus carpetas en features/, entities/ e infra/ y su pantallas/<área>.ts; index.ts, client.ts y composicion.ts sólo reexportan por área y un paso nuevo no los edita; el test de arquitectura falla si un área importa a otra'
  - id: '4.15-5'
    titulo: 'La guarda de carriles lee docs/plan.yaml (B y C crean migraciones de sus dominios) y docs/ORCA.md al día (4-84)'
