# El plan de las fases 5 a 9 para el coordinador (esquema plan/v1). Lo valida `node scripts/coordinador/coordinador.mjs validar` (y `pnpm test`).
# El texto de cada paso (qué entra, su assert, el lugar y las dudas con su recomendada) está en docs/PLAN.md, en la «Partición» de su fase; aquí
# va lo que el coordinador necesita: dependencias, riesgo, ruteo y qué toca. Las cinco fases están abiertas a la vez: un paso empieza
# cuando sus dependencias están integradas en main, sea de la fase que sea, y cada carril toma primero el de camino más largo. Cómo se
# reparten y por qué, en docs/PLAN.md › «Carriles de las fases 5 a 9».
#
# `a` es el carril base: el núcleo de cada módulo (sus entradas, la pantalla con sus huecos), `src/shared`, el shell, notificaciones,
# lo que cruza módulos y los cierres. `b` y `c` poseen ÁREAS enteras (features/<área>/, entities/<área>/, infra/<área>/, areas/<área>/ y
# pantallas/<área>*.ts) o módulos enteros; lo que necesitan del núcleo lo agregan o editan en su PR (no lo borran) y lo de otro carril
# que no es base lo piden con una compuerta `espera`. `modulos` de un paso de `b` o `c` lista sólo lo suyo y lo libre (`docs/` y
# `compartido`: carpetas donde cada paso agrega archivos con nombre propio). `migraciones`: los dominios con que empieza el nombre de
# una migración de ese carril; la de otro dominio la crea el base. `puerta`: antes de empezar, el CI de main en verde. `cierre`: cierra
# su fase con el Nivel 3. La guarda de carriles (CI, scripts/guardas/carriles.mjs) lee este archivo de la base del PR.
