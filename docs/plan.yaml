        src/modules/cotizaciones/pantallas/comentarios.ts,
        src/modules/cotizaciones/pantallas/comentarios-cotizacion.ts,
        src/app/(app)/cotizaciones/papelera/,
        # Su pestaña de Configuración › Empresa (4.15-6c): la lista y la sección; la barra y la página son del A (4-89).
        src/app/(app)/configuracion/empresa/comprobantes/,
        # Las RPC con tamaño de su papelera (4.15-7): el registro del núcleo es del A y las suma.
        scripts/guardas/paginas-en-la-base-papelera.ts,
        # Los <Confirmar> de su área (4.24-2b): el registro del núcleo es del A y los suma.
        scripts/guardas/confirmar-con-url-papelera.ts,
        # Sus registros de las guardas (`registros-de-carriles.ts`): `confirmar-con-url`, `drawers-con-salida` y `paginas-en-la-base` los descubren solas.
        scripts/guardas/areas-c/,
