        src/modules/cotizaciones/pantallas/papelera-listado.ts,
        src/modules/cotizaciones/features/final/,
        src/modules/cotizaciones/entities/final/,
        src/modules/cotizaciones/infra/final/,
        src/modules/cotizaciones/areas/final/,
        src/modules/cotizaciones/pantallas/final.ts,
        src/modules/cotizaciones/pantallas/final-cotizacion.ts,
        src/modules/cotizaciones/features/comprobantes/,
        src/modules/cotizaciones/entities/comprobantes/,
        src/modules/cotizaciones/infra/comprobantes/,
        src/modules/cotizaciones/areas/comprobantes/,
        src/modules/cotizaciones/pantallas/comprobantes.ts,
