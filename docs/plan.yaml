    ruteo:
      { agente: claude, modelo: sonnet, effort: high, modo: auto, sesion: nueva, revisor: ninguno }
    verificacion: 'Nivel 1'
    terminado: 'carriles.mjs mira las ramas b/ y c/ con los dominios de docs/plan.yaml; ORCA dice los carriles de la Fase 4; cierra 4-84'
  - id: '4.15-6a'
    titulo: 'Los huecos de la hoja: el ⚙ de una celda (también en Avanzado) y el enlace de la fórmula sin publicar, sin cambio visible'
