# El plan de la fase 4 para el coordinador (esquema plan/v1, el de calesa-web). Lo valida `node scripts/coordinador/coordinador.mjs validar`.
# El texto de cada paso, sus preguntas y su criterio completo están en docs/PLAN.md; aquí va lo que el coordinador necesita: dependencias,
# riesgo, ruteo (modelo, effort, modo) y qué toca. Los carriles trabajan por ÁREA del módulo cotizaciones: el paso 4.15-4 parte sus
# entradas para que un paso nuevo agregue archivos propios y no edite los compartidos; antes de él y después de todos (4.28) trabaja el
# carril `base`, que posee el módulo entero. `compartido`: carpetas donde cada paso sólo agrega archivos con nombre propio
# (migraciones con marca de tiempo, tests SQL, specs e2e); `database.types.ts` se regenera con `pnpm db:types` al integrar.
esquema: plan/v1
semilla: importadora fase 4
agentes_disponibles: [claude]
compartido: [supabase/migrations/, supabase/tests/, e2e/, src/shared/types/]

carriles:
  - id: base
    base: true
    dueno_de: [src/modules/cotizaciones/, src/app/, src/shared/, scripts/, .claude/, .github/, package.json, pnpm-lock.yaml, lefthook.yml, design/, supabase/]
  - id: listado
    dueno_de: [src/modules/cotizaciones/features/listado/, src/modules/cotizaciones/entities/listado/, src/modules/cotizaciones/infra/listado/, src/modules/cotizaciones/features/tarjeta/, src/modules/cotizaciones/entities/tarjeta/, src/modules/cotizaciones/infra/tarjeta/, src/modules/cotizaciones/features/plantilla/, src/modules/cotizaciones/entities/plantilla/, src/modules/cotizaciones/infra/plantilla/, src/modules/cotizaciones/pantallas/listado.ts, src/modules/cotizaciones/pantallas/tarjeta.ts, src/modules/cotizaciones/pantallas/plantilla.ts, src/app/(app)/cotizaciones/page.tsx, src/app/(app)/_shell/, src/modules/leads/, src/modules/vehiculos/]
  - id: formula
    dueno_de: [src/modules/cotizaciones/features/formula/, src/modules/cotizaciones/entities/formula/, src/modules/cotizaciones/infra/formula/, src/modules/cotizaciones/features/diseno/, src/modules/cotizaciones/entities/diseno/, src/modules/cotizaciones/infra/diseno/, src/modules/cotizaciones/features/tablas/, src/modules/cotizaciones/entities/tablas/, src/modules/cotizaciones/infra/tablas/, src/modules/cotizaciones/pantallas/formula.ts, src/modules/cotizaciones/pantallas/diseno.ts, src/modules/cotizaciones/pantallas/tablas.ts, src/app/(app)/configuracion/cotizacion/]
  - id: papelera
    dueno_de: [src/modules/cotizaciones/features/papelera/, src/modules/cotizaciones/entities/papelera/, src/modules/cotizaciones/infra/papelera/, src/modules/cotizaciones/features/final/, src/modules/cotizaciones/entities/final/, src/modules/cotizaciones/infra/final/, src/modules/cotizaciones/features/comprobantes/, src/modules/cotizaciones/entities/comprobantes/, src/modules/cotizaciones/infra/comprobantes/, src/modules/cotizaciones/features/comentarios/, src/modules/cotizaciones/entities/comentarios/, src/modules/cotizaciones/infra/comentarios/, src/modules/cotizaciones/pantallas/papelera.ts, src/modules/cotizaciones/pantallas/final.ts, src/modules/cotizaciones/pantallas/comprobantes.ts, src/modules/cotizaciones/pantallas/comentarios.ts]

pasos:
  - id: "4.15-3"
    titulo: 'La pantalla de una cotización guardada: /cotizaciones/[id], revisiones por cursor y «Cotizar encima»'
    depende_de: []
    carril: base
    riesgo: ambar
    modulos: [src/modules/cotizaciones/, src/app/(app)/cotizaciones/, docs/]
    ruteo: {agente: claude, modelo: sonnet, effort: high, modo: auto, sesion: nueva, revisor: ninguno}
    verificacion: 'Nivel 1; el completo de escritorio por la cuenta (1 de 3)'
    terminado: 'La pantalla edita SU versión, ofrece cotizar encima y lista las revisiones por cursor registradas en RPC_PAGINADAS'
  - id: "4.15-4"
    titulo: 'Partir las entradas de cotizaciones por área para correr carriles en paralelo (sin cambiar el comportamiento)'
    depende_de: ["4.15-3"]
    carril: base
    riesgo: ambar
    modulos: [src/modules/cotizaciones/, docs/]
    ruteo: {agente: claude, modelo: sonnet, effort: high, modo: auto, sesion: nueva, revisor: ninguno}
    verificacion: 'Nivel 1; nada cambia de pantalla'
    terminado: 'Cada área (listado, tarjeta, plantilla, formula, diseno, tablas, papelera, final, comprobantes, comentarios) tiene sus carpetas en features/, entities/ e infra/ y su pantallas/<área>.ts; index.ts, client.ts y composicion.ts sólo reexportan por área y un paso nuevo no los edita; el test de arquitectura falla si un área importa a otra'
  - id: "4.16"
    titulo: 'El listado /cotizaciones con resumen, «Vencida», cursor, volumen medido y navegación'
    depende_de: ["4.15-4"]
    carril: listado
    riesgo: ambar
    modulos: [src/modules/cotizaciones/features/listado/, src/modules/cotizaciones/entities/listado/, src/modules/cotizaciones/infra/listado/, src/modules/cotizaciones/pantallas/listado.ts, src/app/(app)/cotizaciones/page.tsx, src/app/(app)/_shell/, docs/]
    ruteo: {agente: claude, modelo: sonnet, effort: high, modo: auto, sesion: nueva, revisor: ninguno}
    verificacion: 'Nivel 2 (_shell) + db:medir:volumen + E2E_VOLUMEN=1'
    terminado: 'El listado pagina por cursor sin crecer con N; cierra 4-14 y 4-23'
  - id: "4.17"
    titulo: 'Secciones «Cotizaciones» de la ficha del lead y del vehículo con «Ver más» (5a-12)'
    depende_de: ["4.16"]
    carril: listado
    riesgo: verde
    modulos: [src/modules/cotizaciones/features/listado/, src/modules/cotizaciones/entities/listado/, src/modules/cotizaciones/infra/listado/, src/modules/cotizaciones/pantallas/listado.ts, src/modules/leads/, src/modules/vehiculos/, docs/]
    ruteo: {agente: claude, modelo: sonnet, effort: high, modo: auto, sesion: nueva, revisor: ninguno}
    verificacion: 'Nivel 1 + cadena db + db:carreras'
    terminado: 'Las dos fichas listan sus cotizaciones con el mismo «Ver más»'
  - id: "4.18"
    titulo: 'La tarjeta, el PDF y compartir (hito 4-A)'
    depende_de: ["4.17"]
    carril: listado
    riesgo: ambar
    modulos: [src/modules/cotizaciones/features/tarjeta/, src/modules/cotizaciones/entities/tarjeta/, src/modules/cotizaciones/infra/tarjeta/, src/modules/cotizaciones/pantallas/tarjeta.ts, docs/]
    ruteo: {agente: claude, modelo: sonnet, effort: high, modo: auto, sesion: nueva, revisor: ninguno}
    verificacion: 'Nivel 1; Nivel 2 del hito'
    terminado: 'Se cotiza de punta a punta con su PDF; el total del PDF es la suma de las líneas'
  - id: "4.19"
    titulo: 'El editor de la plantilla con vista previa en vivo'
    depende_de: ["4.18"]
    carril: listado
    riesgo: verde
    modulos: [src/modules/cotizaciones/features/plantilla/, src/modules/cotizaciones/entities/plantilla/, src/modules/cotizaciones/infra/plantilla/, src/modules/cotizaciones/pantallas/plantilla.ts, docs/]
    ruteo: {agente: claude, modelo: sonnet, effort: medium, modo: auto, sesion: nueva, revisor: ninguno}
    verificacion: 'Nivel 1'
    terminado: 'La plantilla se edita con vista previa en vivo'
  - id: "4.20"
    titulo: 'La fórmula: versiones, publicar con nota, historial, revertir y el ⚙; Configuración › Cotización'
    depende_de: ["4.15-4"]
    carril: formula
    riesgo: rojo
    modulos: [src/modules/cotizaciones/features/formula/, src/modules/cotizaciones/entities/formula/, src/modules/cotizaciones/infra/formula/, src/modules/cotizaciones/pantallas/formula.ts, src/app/(app)/configuracion/cotizacion/, docs/]
    ruteo: {agente: claude, modelo: opus, effort: high, modo: plan→auto, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: 'Nivel 1 + cadena db'
    terminado: 'Publicar, revertir y el ⚙ crean la N+1; cierra 4-8, 4-33, 4-36, 4-19, 4-20, 5a-29 y 5a-30'
  - id: "4.21"
    titulo: 'El editor de la fórmula como el Excel'
    depende_de: ["4.20"]
    carril: formula
    riesgo: ambar
    modulos: [src/modules/cotizaciones/features/formula/, src/modules/cotizaciones/entities/formula/, src/modules/cotizaciones/infra/formula/, src/modules/cotizaciones/pantallas/formula.ts, docs/]
    ruteo: {agente: claude, modelo: sonnet, effort: high, modo: auto, sesion: nueva, revisor: ninguno}
    verificacion: 'Nivel 1'
    terminado: 'Cada fila se edita en texto, compilada por 4.07; cierra 4-5 y 4-6'
  - id: "4.22"
    titulo: 'El editor del diseño con vista previa a 412 y 1.280 px y al 200 %'
    depende_de: ["4.21"]
    carril: formula
    riesgo: ambar
    modulos: [src/modules/cotizaciones/features/diseno/, src/modules/cotizaciones/entities/diseno/, src/modules/cotizaciones/infra/diseno/, src/modules/cotizaciones/pantallas/diseno.ts, docs/]
    ruteo: {agente: claude, modelo: sonnet, effort: high, modo: auto, sesion: nueva, revisor: ninguno}
    verificacion: 'Nivel 1'
    terminado: 'El diseño se edita; avisa sin bloquear cuando un nodo restringido es el único oculto de una suma; cierra 4-30'
  - id: "4.23"
    titulo: 'Las tablas de referencia: editar, reordenar y publicar la N+1'
    depende_de: ["4.22"]
    carril: formula
    riesgo: rojo
    modulos: [src/modules/cotizaciones/features/tablas/, src/modules/cotizaciones/entities/tablas/, src/modules/cotizaciones/infra/tablas/, src/modules/cotizaciones/pantallas/tablas.ts, docs/]
    ruteo: {agente: claude, modelo: opus, effort: high, modo: plan→auto, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: 'Nivel 2 + db:carreras'
    terminado: 'Las tablas de referencia tienen versión y se publican; primero 5b-7'
  - id: "4.24"
    titulo: 'La papelera propia de cotizaciones: permiso, versión, purga por lotes y «Deshacer»'
    depende_de: ["4.15-4"]
    carril: papelera
    riesgo: rojo
    modulos: [src/modules/cotizaciones/features/papelera/, src/modules/cotizaciones/entities/papelera/, src/modules/cotizaciones/infra/papelera/, src/modules/cotizaciones/pantallas/papelera.ts, docs/]
    ruteo: {agente: claude, modelo: opus, effort: high, modo: plan→auto, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: 'Nivel 2 + medir-jobs.sql'
    terminado: 'cotizaciones.papelera.purgar gobierna su papelera; cierra 4-68 y 4-70'
  - id: "4.25"
    titulo: 'Marcar final: candados en el orden de vincular, lead a cliente y final como ancla'
    depende_de: ["4.24"]
    carril: papelera
    riesgo: rojo
    modulos: [src/modules/cotizaciones/features/final/, src/modules/cotizaciones/entities/final/, src/modules/cotizaciones/infra/final/, src/modules/cotizaciones/pantallas/final.ts, docs/]
    ruteo: {agente: claude, modelo: opus, effort: high, modo: plan→auto, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: 'Nivel 1 + cadena db + db:carreras + medir-jobs.sql'
    terminado: 'cotizacion_marcar_final no deja deadlock; cierra 4-17'
  - id: "4.26"
    titulo: 'Comprobantes: emitir y anular con numeración sin huecos'
    depende_de: ["4.25"]
    carril: papelera
    riesgo: rojo
    modulos: [src/modules/cotizaciones/features/comprobantes/, src/modules/cotizaciones/entities/comprobantes/, src/modules/cotizaciones/infra/comprobantes/, src/modules/cotizaciones/pantallas/comprobantes.ts, docs/]
    ruteo: {agente: claude, modelo: opus, effort: high, modo: plan→auto, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: 'Nivel 2 + db:carreras'
    terminado: 'La numeración no tiene huecos bajo carrera; la serie se configura en Empresa'
  - id: "4.27"
    titulo: 'Comentarios anidados, adjuntos, favoritos, reportes y moderar'
    depende_de: ["4.26"]
    carril: papelera
    riesgo: rojo
    modulos: [src/modules/cotizaciones/features/comentarios/, src/modules/cotizaciones/entities/comentarios/, src/modules/cotizaciones/infra/comentarios/, src/modules/cotizaciones/pantallas/comentarios.ts, docs/]
    ruteo: {agente: claude, modelo: opus, effort: high, modo: plan→auto, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: 'Nivel 2 (storage.objects)'
    terminado: 'Los comentarios y adjuntos respetan los niveles; cierra 4-69'
  - id: "4.28"
    titulo: 'El cierre: recorrido de la IA con dos cuentas, criterios, 5a-4b y 5a-33'
    depende_de: ["4.19", "4.23", "4.27"]
    carril: base
    riesgo: ambar
    modulos: [src/modules/cotizaciones/, docs/, docs/]
    ruteo: {agente: claude, modelo: opus, effort: high, modo: auto, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: 'Nivel 3'
    terminado: 'Fase 4 cerrada con la tabla de criterios, ESTADO y BITACORA'
