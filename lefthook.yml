pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: '*.{js,jsx,ts,tsx,mts}'
      # --no-warn-ignored: en stage hay archivos ignorados a propósito (sw.js, tipos generados)
      run: npx eslint --fix --max-warnings 0 --no-warn-ignored {staged_files}
      stage_fixed: true
    - name: format
      glob: '*.{ts,tsx,css,json,md,yml,mjs}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: '*.{ts,tsx,mts}'
      run: pnpm typecheck
    - name: mapa
      run: bash scripts/mapa.sh --check # docs/MAPA.md no se versiona y va en .prettierignore

# El schema en PGlite con sus pruebas: una vez al empujar SQL, no en cada commit, y en su modo rápido (sin los 7 bloques [lento],
# ≈ 1,5 min en vez de 5). El job «Base» del CI corre el completo, también contra la base real (.claude/rules/migraciones.md).
pre-push:
  jobs:
    - name: schema
      glob: 'supabase/**/*.sql'
      run: PROBAR_RAPIDO=1 node scripts/probar-schema.mjs supabase

# docs/MAPA.md no se versiona: se regenera al cambiar de rama y al integrar (scripts/mapa.sh).
post-checkout:
  jobs:
    - name: mapa
      run: bash scripts/mapa.sh >/dev/null

post-merge:
  jobs:
    - name: mapa
      run: bash scripts/mapa.sh >/dev/null

commit-msg:
  jobs:
    - run: npx commitlint --edit {1}
