# Supabase CLI — proyecto importadora. Un carril de Orca cambia el project_id y los puertos por entorno (.env.carril, docs/ORCA.md).
# Puertos en el bloque 546xx: el 5432x por defecto choca con otros stacks locales de la misma máquina.
project_id = "importadora"

[api]
enabled = true
port = 54621
schemas = ["public", "graphql_public", "web"]   # `web` es la superficie de la web pública
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54622
shadow_port = 54620
major_version = 17

[db.seed]
enabled = true
# El orden es el de las dependencias: el seed (empresa, permisos, orígenes, flujos), las fórmulas del cotizador (necesitan los orígenes, los tonos y los tipos de
# cambio), y al final las estadísticas. `scripts/probar-schema.mjs` lee esta lista.
sql_paths = [
  "./seed.sql",
  "./semillas/cotizador-subasta-usa.sql",
  "./semillas/cotizador-oficina.sql",
  "./semillas/cotizador-planilla-usa.sql",
  "./semillas/estadisticas.sql",
]

[studio]
enabled = true
port = 54623

# Correo local: los mails de auth (confirmar, recuperar, invitar) se leen acá, no se envían.
[local_smtp]
enabled = true
port = 54624

[analytics]
enabled = true
port = 54627

[auth]
enabled = true
site_url = "http://localhost:3000"
# Destinos permitidos para `redirectTo` (ingreso con Google). 3210 es el puerto de los e2e; 3100/3310 y 3200/3410, la app y los e2e
# de los carriles de Orca (scripts/lib/stack-local.mjs; cada carril pone su site_url con SUPABASE_AUTH_SITE_URL).
additional_redirect_urls = [
  "https://localhost:3000/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
  "http://localhost:3210/**",
  "http://localhost:3100/**",
  "http://localhost:3310/**",
  "http://localhost:3200/**",
  "http://localhost:3410/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true          # el candado real es ajustes_empresa.registro_abierto (trigger en auth.users)
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_expiry = 3600

# Correos en español con `token_hash`: /auth/callback los canjea sin depender del navegador que
# pidió el enlace. En la nube las sube scripts/demo/restaurar.sh (docs/ENTORNOS.md).
[auth.email.template.confirmation]
subject = "Confirmación de tu cuenta"
content_path = "./supabase/templates/confirmacion.html"

[auth.email.template.recovery]
subject = "Recuperación de tu contraseña"
content_path = "./supabase/templates/recuperacion.html"

# La manda `auth.admin.inviteUserByEmail` al invitar desde Configuración › Equipo.
[auth.email.template.invite]
subject = "Invitación al equipo"
content_path = "./supabase/templates/invitacion.html"

[auth.email.template.email_change]
subject = "Confirma el cambio de tu correo"
content_path = "./supabase/templates/cambio-de-correo.html"

[auth.email.template.magic_link]
subject = "Tu enlace para ingresar"
content_path = "./supabase/templates/enlace-de-ingreso.html"

[auth.email.template.reauthentication]
subject = "Tu código de confirmación"
content_path = "./supabase/templates/reautenticacion.html"

# Apagado en local: sin credenciales reales el botón aparecería y fallaría en la página de Google.
# La app lo dibuja sólo si Auth dice que el proveedor está encendido (/auth/v1/settings).
# En la nube se enciende desde Auth › Providers, con sus credenciales.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
skip_nonce_check = false

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[edge_runtime]
enabled = true
policy = "oneshot"

# La llama la base (pg_net), que no tiene un JWT que mandar: se autentica con un pase de un
# solo uso que la propia función canjea (supabase/functions/README.md).
[functions.storage-gc]
verify_jwt = false

# Igual que storage-gc: la llama la base (pg_net) con un pase de un solo uso; hace las miniaturas de los avatares que no la
# tienen (cierre 1).
[functions.avatares-miniaturas]
verify_jwt = false

# La llama el navegador con la sesión de quien da de alta o refresca: el gateway verifica el JWT y
# la propia función le pregunta a la base qué puede hacer esa persona en ese origen antes de leer
# la clave de apibara de Vault (supabase/functions/README.md).
[functions.apibara]
verify_jwt = true

# ---------------------------------------------------------------------------------------------------------------------------------
# La demo (Supabase Pro, sin datos reales). Lo sube scripts/demo/restaurar.sh con las variables de `.env.demo` (docs/ENTORNOS.md);
# lo demás de este archivo vale igual allá (las plantillas, el registro, las funciones). El comodín de los previews de Vercel es
# **sólo de la demo: se quita en la instalación de un cliente**.
[remotes.demo]
project_id = "fjvrjndglytyhvlxifeb"

[remotes.demo.auth]
site_url = "env(DEMO_SITE_URL)"
# El sitio, los previews de Vercel (`https://*-<equipo>.vercel.app/**`, sólo demo) y los puertos locales de los carriles.
additional_redirect_urls = [
  "env(DEMO_REDIRECCION_SITIO)",
  "env(DEMO_REDIRECCION_PREVIEWS)",
  "http://localhost:3000/**",
  "http://localhost:3100/**",
  "http://localhost:3200/**",
]

[remotes.demo.auth.email]
# 24 h: lo que vive una invitación (el máximo de la nube; decidido el 2026-10-21). En local, 1 h.
otp_expiry = 86400

# Los correos de Auth por SMTP, con nombres genéricos: Resend hoy, Cloudflare Email Service después; cambiar es cambiar variables.
# El puerto va fijo porque la CLI no lee `env()` en un número: 465 (TLS implícito) es el de los dos (Cloudflare sólo ofrece ése).
[remotes.demo.auth.email.smtp]
enabled = true
host = "env(SMTP_HOST)"
port = 465
user = "env(SMTP_USUARIO)"
pass = "env(SMTP_CLAVE)"
admin_email = "env(EMAIL_REMITENTE)"
sender_name = "env(EMAIL_REMITENTE_NOMBRE)"
